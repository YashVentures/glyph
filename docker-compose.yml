version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: glyph-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: glyph_db
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: glyph-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MONGODB_URL: mongodb://mongodb:27017/glyph_db
      DB_NAME: glyph_db
      PORT: 8000
      HOST: 0.0.0.0
      CORS_ORIGINS: http://localhost:3000
      DEFAULT_WORKSPACE_ID: default-workspace
      DEFAULT_USER_ID: default-user
      AI_PROVIDER: none
      AI_MODEL: none
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: glyph-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  mongo_data:
